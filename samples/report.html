<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>耳机使用统计</title>
<style>
  :root {
    --bg: #ffffff; --fg: #1d1d1f; --muted: #86868b; --line: #e8e8ed;
    --accent: #0a84ff; --warn: #ff453a; --card: #f5f5f7;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#000; --fg:#f5f5f7; --muted:#8e8e93; --line:#2c2c2e; --card:#1c1c1e; }
  }
  * { box-sizing: border-box; }
  body { margin:0 auto; max-width: 1000px; padding: 40px 24px 80px; background: var(--bg);
         color: var(--fg); font: 15px/1.6 -apple-system, BlinkMacSystemFont, "SF Pro Text",
         "PingFang SC", "Helvetica Neue", Arial, sans-serif;
         -webkit-font-smoothing: antialiased; }
  h1 { font-size: 28px; font-weight: 700; letter-spacing: -.02em; margin: 0 0 6px; }
  h2 { font-size: 17px; font-weight: 650; margin: 36px 0 6px; letter-spacing: -.01em; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 22px; }
  .muted { color: var(--muted); font-size: 13px; }

  .rangebar { display: inline-flex; background: var(--card); border-radius: 9px; padding: 3px;
              gap: 2px; margin-bottom: 20px; }
  .rangebar button { border: 0; background: transparent; color: var(--muted); font: inherit;
                     font-size: 13px; padding: 5px 14px; border-radius: 7px; cursor: pointer; }
  .rangebar button.on { background: var(--bg); color: var(--fg); font-weight: 600;
                        box-shadow: 0 1px 3px rgba(0,0,0,.12); }

  .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  @media (max-width: 640px) { .cards { grid-template-columns: repeat(2, 1fr); } }
  .card { background: var(--card); border-radius: 14px; padding: 15px 16px 13px; }
  .ct { font-size: 12px; color: var(--muted); margin-bottom: 5px; }
  .cv { font-size: 20px; font-weight: 650; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .cs { font-size: 11px; color: var(--muted); margin-top: 3px; }

  ul.insights { list-style: none; padding: 0; margin: 4px 0 0; }
  ul.insights li { position: relative; padding: 4px 0 4px 18px; font-size: 14px; }
  ul.insights li::before { content: "·"; position: absolute; left: 4px; color: var(--accent); font-weight: 700; }

  .panel { background: var(--card); border-radius: 14px; padding: 16px 16px 12px; }
  .bars-wrap { display: flex; align-items: flex-end; gap: 2px; height: 150px; padding-top: 10px; }
  .bar { flex: 1 1 0; min-width: 1px; background: var(--accent); border-radius: 2px 2px 0 0;
         transition: opacity .12s; position: relative; }
  .bar.weekend { opacity: .45; }
  .bar:hover { opacity: .7; }
  .axis { display: grid; gap: 2px; font-size: 10px; color: var(--muted);
          margin-top: 6px; }
  .axis span { white-space: nowrap; overflow: visible; }

  .heat { display: grid; grid-template-columns: 18px repeat(24, 1fr); gap: 2px; align-items: center; }
  .heat .hd { font-size: 9px; color: var(--muted); text-align: center; }
  .heat .rh { font-size: 10px; color: var(--muted); text-align: right; padding-right: 2px; }
  .heat .cell { height: 17px; border-radius: 3px; background: var(--accent); opacity: .07; }
  .heat .cell:hover { outline: 1.5px solid var(--accent); outline-offset: -1.5px; }
  .heat-foot { display: grid; grid-template-columns: 18px repeat(24, 1fr); gap: 2px; font-size: 8px;
               color: var(--muted); margin-top: 3px; }

  .vbars { display: flex; flex-direction: column; gap: 7px; max-width: 660px; }
  .vrow { display: grid; grid-template-columns: 62px 1fr 84px; align-items: center; gap: 10px; }
  .vlabel { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .vtrack { height: 9px; background: rgba(128,128,128,.16); border-radius: 5px; overflow: hidden; }
  .vfill { display: block; height: 100%; background: var(--accent); border-radius: 5px; }
  .vfill.loud { background: var(--warn); }
  .vvalue { font-size: 11px; text-align: right; font-variant-numeric: tabular-nums; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; font-weight: 500; color: var(--muted); font-size: 12px;
       padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  td { padding: 8px 10px; border-bottom: 1px solid var(--line); }
  .num { text-align: right; font-variant-numeric: tabular-nums; }
  .hot { color: var(--warn); font-weight: 600; }
  tr:hover td { background: rgba(128,128,128,.06); }
  footer { margin-top: 48px; color: var(--muted); font-size: 12px;
           border-top: 1px solid var(--line); padding-top: 14px; }
  .empty { color: var(--muted); font-size: 13px; padding: 12px 0; }
</style>
</head>
<body>
<h1>耳机使用统计</h1>
<div class="sub" id="meta"></div>

<div class="rangebar" id="rangebar">
  <button data-range="7">7 天</button>
  <button data-range="30">30 天</button>
  <button data-range="90">90 天</button>
  <button data-range="all" class="on">全部</button>
</div>

<div class="cards" id="cards"></div>

<h2>一眼结论</h2>
<ul class="insights" id="insights"></ul>

<h2>每日佩戴时长</h2>
<div class="panel">
  <div class="bars-wrap" id="daily"></div>
  <div class="axis" id="axis"></div>
</div>

<h2>一周里的使用时段</h2>
<div class="panel">
  <div class="heat" id="heat"></div>
  <div class="heat-foot" id="heatfoot"></div>
  <div class="muted" style="margin-top:8px">颜色越深表示该时段累计佩戴越久；<span style="opacity:.45">浅色为周末</span></div>
</div>

<h2>音量分布</h2>
<div class="panel" id="volume"></div>

<h2>最长的佩戴记录</h2>
<div class="panel" id="table"></div>

<footer id="footer"></footer>

<script>
(function () {
  const DATA = JSON.parse(document.getElementById('data').textContent);
  const SESSIONS = DATA.sessions || [];
  const META = DATA.meta || {};
  let range = 'all';

  // ---------- 工具 ----------
  function fmtDur(sec) {
    const minutes = Math.round((sec || 0) / 60);
    const h = Math.floor(minutes / 60);
    const m = minutes % 60;
    if (h > 0) return h + ' 小时' + (m > 0 ? ' ' + String(m).padStart(2, '0') + ' 分' : '');
    return minutes + ' 分钟';
  }
  function fmtShort(sec) {
    const t = Math.round(sec || 0);
    return Math.floor(t / 3600) + ':' + String(Math.round((t % 3600) / 60)).padStart(2, '0');
  }
  const WEEK = ['周日','周一','周二','周三','周四','周五','周六'];
  function dayKey(d) {
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }
  function startOfDay(ts) {
    const d = new Date(ts * 1000);
    return new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime() / 1000;
  }
  function nextDayStart(ts) {
    const d = new Date(ts * 1000);
    return new Date(d.getFullYear(), d.getMonth(), d.getDate() + 1).getTime() / 1000;
  }
  // 会话内真正有样本的区间（会话中间可能摘过耳机）
  function spansOf(s) { return (s.g && s.g.length) ? s.g : [[s.s, s.e]]; }
  // 沿真实区间遍历，step 返回下一个切分点
  function walkSpans(list, step) {
    for (const s of list) {
      const spans = spansOf(s);
      for (const sp of spans) {
        let cur = sp[0], guardCount = 0;
        while (cur < sp[1] && guardCount++ < 3000) {
          const next = step(cur, sp[1], s);
          if (!(next > cur)) break;
          cur = next;
        }
      }
    }
  }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  }

  // ---------- 过滤 ----------
  const lastEnd = SESSIONS.length ? Math.max.apply(null, SESSIONS.map(s => s.e)) : 0;

  function inRange() {
    if (range === 'all') return SESSIONS.slice();
    const cutoff = lastEnd - Number(range) * 86400;
    return SESSIONS.filter(s => s.e >= cutoff);
  }

  // ---------- 统计 ----------
  function computeStats(list) {
    let total = 0, loud = 0, veryLoud = 0, longest = 0, peak = 0;
    let dbWeighted = 0, dbSeconds = 0;
    const byDay = new Map();
    for (const s of list) {
      const dur = s.d;
      total += dur;
      loud += s.loud || 0;
      veryLoud += s.vl || 0;
      longest = Math.max(longest, dur);
      if (s.mx > peak) peak = s.mx;
      if (s.db > 0 && dur > 0) { dbWeighted += s.db * dur; dbSeconds += dur; }
    }
    // 按天累计（只算真正有样本的区间）
    walkSpans(list, function (cur, spanEnd, s) {
      const pieceEnd = Math.min(spanEnd, nextDayStart(cur));
      const key = dayKey(new Date(cur * 1000));
      const rec = byDay.get(key) || { sec: 0, sessions: 0, maxDb: 0 };
      rec.sec += pieceEnd - cur;
      if (rec.maxDb < (s.mx || 0)) rec.maxDb = s.mx || 0;
      byDay.set(key, rec);
      return pieceEnd;
    });
    // 会话数按起始日计
    for (const s of list) {
      const k = dayKey(new Date(s.s * 1000));
      const rec = byDay.get(k);
      if (rec) { rec.sessions += 1; byDay.set(k, rec); }
    }
    const activeDays = Array.from(byDay.values()).filter(v => v.sec >= 60).length;
    const days = Array.from(byDay.keys()).sort();
    let spanDays = 1;
    if (days.length) {
      spanDays = Math.round((startOfDay(new Date(days[days.length - 1]).getTime() / 1000) -
                             startOfDay(new Date(days[0]).getTime() / 1000)) / 86400) + 1;
    }
    return {
      total, loud, veryLoud, longest, peak,
      avgDb: dbSeconds > 0 ? dbWeighted / dbSeconds : 0,
      activeDays, spanDays, byDay,
      count: list.length,
      avgSession: list.length ? total / list.length : 0,
      avgActiveDay: activeDays ? total / activeDays : 0,
      avgAllDay: total / Math.max(spanDays, 1)
    };
  }

  // ---------- 卡片 ----------
  function renderCards(st) {
    const items = [
      ['累计佩戴', fmtDur(st.total), st.spanDays + ' 天窗口 · ' + st.activeDays + ' 天有使用'],
      ['佩戴次数', st.count + ' 次', '平均 ' + fmtDur(st.avgSession)],
      ['使用天数', st.activeDays + ' 天', '最长单次 ' + fmtDur(st.longest)],
      ['活跃日日均', fmtDur(st.avgActiveDay), '按全部天数 ' + fmtDur(st.avgAllDay)],
      ['平均音量', st.avgDb > 0 ? Math.round(st.avgDb) + ' dB' : '—', '峰值 ' + (st.peak > 0 ? Math.round(st.peak) + ' dB' : '—')],
      ['≥80 dB 时长', fmtDur(st.loud), st.total > 0 ? '占 ' + (st.loud / st.total * 100).toFixed(1) + '%' : '—']
    ];
    document.getElementById('cards').innerHTML = items.map(function (it) {
      return '<div class="card"><div class="ct">' + it[0] + '</div><div class="cv">' + it[1] +
             '</div><div class="cs">' + it[2] + '</div></div>';
    }).join('');
  }

  // ---------- 每日柱状 ----------
  function renderDaily(st, list) {
    const keys = Array.from(st.byDay.keys()).sort();
    const host = document.getElementById('daily');
    const axis = document.getElementById('axis');
    if (!keys.length) { host.innerHTML = '<div class="empty">无数据</div>'; axis.innerHTML = ''; return; }
    // 补齐中间空缺的日期
    const first = new Date(keys[0] + 'T00:00:00');
    const last = new Date(keys[keys.length - 1] + 'T00:00:00');
    const series = [];
    for (let d = new Date(first); d <= last; d.setDate(d.getDate() + 1)) {
      const k = dayKey(d);
      const rec = st.byDay.get(k);
      series.push({ key: k, date: new Date(d), sec: rec ? rec.sec : 0, n: rec ? rec.sessions : 0 });
    }
    const maxVal = Math.max.apply(null, series.map(s => s.sec).concat([1]));
    host.innerHTML = series.map(function (s) {
      const pct = Math.max(s.sec > 0 ? 1.5 : 0.6, s.sec / maxVal * 100);
      const weekend = [0, 6].includes(s.date.getDay());
      const label = (s.date.getMonth() + 1) + '/' + s.date.getDate() + ' ' + WEEK[s.date.getDay()];
      const tip = label + '　' + fmtDur(s.sec) + (s.n ? '　' + s.n + ' 次' : '');
      return '<div class="bar' + (weekend ? ' weekend' : '') + '" style="height:' + pct +
             '%" title="' + esc(tip) + '"></div>';
    }).join('');
    // 每根柱子一格，按需标注日期，保证刻度与柱体对齐
    const step = Math.max(1, Math.ceil(series.length / 8));
    axis.style.gridTemplateColumns = 'repeat(' + series.length + ', minmax(0, 1fr))';
    axis.innerHTML = series.map(function (s, i) {
      if (i % step !== 0) return '<span></span>';
      return '<span>' + (s.date.getMonth() + 1) + '/' + s.date.getDate() + '</span>';
    }).join('');
  }

  // ---------- 热力图 ----------
  function renderHeat(list) {
    const grid = [];
    for (let r = 0; r < 7; r++) grid.push(new Array(24).fill(0));
    walkSpans(list, function (cur, spanEnd) {
      const d = new Date(cur * 1000);
      const hourEnd = new Date(d.getFullYear(), d.getMonth(), d.getDate(), d.getHours() + 1).getTime() / 1000;
      const pieceEnd = Math.min(spanEnd, hourEnd);
      grid[d.getDay()][d.getHours()] += pieceEnd - cur;
      return pieceEnd;
    });
    let max = 0;
    grid.forEach(row => row.forEach(v => { if (v > max) max = v; }));
    let html = '<div class="hd"></div>';
    for (let h = 0; h < 24; h++) html += '<div class="hd">' + (h % 3 === 0 ? h : '') + '</div>';
    for (let r = 0; r < 7; r++) {
      html += '<div class="rh">' + WEEK[r].slice(1) + '</div>';
      for (let h = 0; h < 24; h++) {
        const v = grid[r][h];
        const ratio = max > 0 ? v / max : 0;
        const opacity = v <= 0 ? 0.05 : 0.14 + ratio * 0.78;
        const tip = WEEK[r] + ' ' + h + ':00 – ' + (h + 1) + ':00　' + (v > 0 ? fmtDur(v) : '无');
        html += '<div class="cell" style="opacity:' + opacity.toFixed(3) + '" title="' + esc(tip) + '"></div>';
      }
    }
    document.getElementById('heat').innerHTML = html;
    const foot = document.getElementById('heatfoot');
    if (foot) foot.innerHTML = '';
  }

  // ---------- 音量分布 ----------
  function renderVolume(list) {
    const bins = [];
    for (let lo = 40; lo < 100; lo += 5) bins.push({ lo: lo, sec: 0 });
    for (const s of list) {
      const dur = s.d;
      if (s.b && s.b.length === bins.length) {
        for (let i = 0; i < bins.length; i++) bins[i].sec += s.b[i] || 0;
      } else if (s.db > 0) {
        const db = Math.min(99.9, Math.max(40, s.db));
        const idx = Math.min(bins.length - 1, Math.max(0, Math.floor((db - 40) / 5)));
        bins[idx].sec += dur;
      }
    }
    const visible = bins.filter(b => b.sec > 0);
    const host = document.getElementById('volume');
    if (!visible.length) { host.innerHTML = '<div class="empty">没有音量数据</div>'; return; }
    const max = Math.max.apply(null, visible.map(b => b.sec));
    host.innerHTML = '<div class="vbars">' + visible.map(function (b) {
      const label = b.lo + '–' + (b.lo + 5) + ' dB';
      return '<div class="vrow"><span class="vlabel">' + label + '</span>' +
             '<span class="vtrack"><span class="vfill' + (b.lo >= 80 ? ' loud' : '') +
             '" style="width:' + (max > 0 ? b.sec / max * 100 : 0).toFixed(1) + '%"></span></span>' +
             '<span class="vvalue">' + fmtDur(b.sec) + '</span></div>';
    }).join('') + '</div><div class="muted" style="margin-top:10px">按每条音频样本的实际音量累计；红色为 ≥80 dB 区间。</div>';
  }

  // ---------- 表格 ----------
  function renderTable(list) {
    const top = list.slice().sort((a, b) => b.d - a.d).slice(0, 30);
    const host = document.getElementById('table');
    if (!top.length) { host.innerHTML = '<div class="empty">无记录</div>'; return; }
    let html = '<table><thead><tr><th>时间</th><th class="num">时长</th><th class="num">平均</th>' +
               '<th class="num">峰值</th><th>设备</th></tr></thead><tbody>';
    for (const s of top) {
      const a = new Date(s.s * 1000), b = new Date(s.e * 1000);
      const dateText = (a.getMonth() + 1) + '月' + a.getDate() + '日 ' + WEEK[a.getDay()] + ' ' +
                       String(a.getHours()).padStart(2, '0') + ':' + String(a.getMinutes()).padStart(2, '0') +
                       '–' + String(b.getHours()).padStart(2, '0') + ':' + String(b.getMinutes()).padStart(2, '0');
      html += '<tr><td>' + dateText + '</td>' +
              '<td class="num">' + fmtDur(s.d) + '</td>' +
              '<td class="num">' + (s.db > 0 ? Math.round(s.db) + ' dB' : '—') + '</td>' +
              '<td class="num' + (s.mx >= 90 ? ' hot' : '') + '">' + (s.mx > 0 ? Math.round(s.mx) : '—') + '</td>' +
              '<td class="muted">' + esc(s.src) + '</td></tr>';
    }
    host.innerHTML = html + '</tbody></table>';
  }

  // ---------- 结论 ----------
  function renderInsights(st, list) {
    const out = [];
    if (!list.length) { document.getElementById('insights').innerHTML = '<li class="empty">这段时间没有佩戴记录</li>'; return; }
    out.push('这段时间累计戴耳机 ' + fmtDur(st.total) + '，平均每天 ' + fmtDur(st.avgAllDay) + '。');

    // 高峰小时
    const hour = new Array(24).fill(0);
    walkSpans(list, function (cur, spanEnd) {
      const d = new Date(cur * 1000);
      const hourEnd = new Date(d.getFullYear(), d.getMonth(), d.getDate(), d.getHours() + 1).getTime() / 1000;
      const pieceEnd = Math.min(spanEnd, hourEnd);
      hour[d.getHours()] += pieceEnd - cur;
      return pieceEnd;
    });
    let peakHour = 0;
    for (let h = 1; h < 24; h++) if (hour[h] > hour[peakHour]) peakHour = h;
    if (hour[peakHour] > 60) {
      out.push(String(peakHour).padStart(2, '0') + ':00–' + String(peakHour + 1).padStart(2, '0') +
               ':00 是最常戴耳机的时段，累计 ' + fmtDur(hour[peakHour]) + '。');
    }

    // 最勤的星期
    const weekday = new Array(7).fill(0);
    walkSpans(list, function (cur, spanEnd) {
      const d = new Date(cur * 1000);
      const pieceEnd = Math.min(spanEnd, nextDayStart(cur));
      weekday[d.getDay()] += pieceEnd - cur;
      return pieceEnd;
    });
    let peakDay = 0;
    for (let i = 1; i < 7; i++) if (weekday[i] > weekday[peakDay]) peakDay = i;
    if (weekday[peakDay] > 60) out.push(WEEK[peakDay] + '用得最多，累计 ' + fmtDur(weekday[peakDay]) + '。');

    // 音量
    if (st.avgDb > 0) {
      const ratio = st.total > 0 ? st.loud / st.total * 100 : 0;
      if (st.avgDb >= 80) {
        out.push('平均音量 ' + Math.round(st.avgDb) + ' dB，属于偏高区间；把音量降 10 dB，同等时长下的听力负担会明显下降。');
      } else if (ratio >= 10) {
        out.push('平均音量 ' + Math.round(st.avgDb) + ' dB 还算克制，但有 ' + ratio.toFixed(0) +
                 '% 的时间超过 80 dB（合计 ' + fmtDur(st.loud) + '）。');
      } else {
        out.push('平均音量 ' + Math.round(st.avgDb) + ' dB，超过 80 dB 的时长占 ' + ratio.toFixed(0) + '%，整体不错。');
      }
    }

    // 90 dB 以上
    if (st.veryLoud > 600) {
      out.push('有 ' + fmtDur(st.veryLoud) + '音量超过 90 dB；在「设置 › 声音与触感 › 耳机安全」里打开「降低高音量」会稳妥一些。');
    }

    // 最长一次
    const longest = list.reduce((a, b) => b.d > a.d ? b : a, list[0]);
    if (longest && longest.d > 600) {
      const d = new Date(longest.s * 1000);
      out.push('最长的一次是 ' + (d.getMonth() + 1) + '月' + d.getDate() + '日 ' + WEEK[d.getDay()] + ' ' +
               String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0') +
               '，连续戴了 ' + fmtDur(longest.d) + '。');
    }

    // 连续天数
    const activeDays = Array.from(st.byDay.entries())
      .filter(e => e[1].sec >= 60).map(e => e[0]).sort();
    if (activeDays.length > 2) {
      let best = 1, run = 1;
      for (let i = 1; i < activeDays.length; i++) {
        const a = new Date(activeDays[i - 1] + 'T00:00:00'), b = new Date(activeDays[i] + 'T00:00:00');
        run = (Math.round((b - a) / 86400000) === 1) ? run + 1 : 1;
        if (run > best) best = run;
      }
      let cur = 1;
      for (let i = activeDays.length - 1; i > 0; i--) {
        const a = new Date(activeDays[i - 1] + 'T00:00:00'), b = new Date(activeDays[i] + 'T00:00:00');
        if (Math.round((b - a) / 86400000) !== 1) break;
        cur++;
      }
      let text = '最长连续 ' + best + ' 天都戴了耳机';
      if (cur >= 3) text += '，目前已经连续 ' + cur + ' 天';
      out.push(text + '。');
    }

    // 最近一周 vs 前一周
    function sumInWindow(from, to) {
      let total = 0;
      for (const s of list) for (const sp of spansOf(s)) {
        const a = Math.max(sp[0], from), b = Math.min(sp[1], to);
        if (b > a) total += b - a;
      }
      return total;
    }
    const lastTs = list.reduce((a, s) => Math.max(a, s.e), 0);
    const week = 7 * 86400;
    const thisWeek = sumInWindow(lastTs - week, lastTs);
    const prevWeek = sumInWindow(lastTs - 2 * week, lastTs - week);
    if (prevWeek > 300 && thisWeek > 0) {
      const delta = (thisWeek - prevWeek) / prevWeek * 100;
      if (Math.abs(delta) >= 8) {
        out.push('最近 7 天 ' + fmtDur(thisWeek) + '，比前一周' +
                 (delta > 0 ? '多了 ' + Math.abs(delta).toFixed(0) + '%' : '少了 ' + Math.abs(delta).toFixed(0) + '%') + '。');
      }
    }

    document.getElementById('insights').innerHTML = out.map(t => '<li>' + t + '</li>').join('');
  }

  // ---------- 主流程 ----------
  function render() {
    const list = inRange();
    const st = computeStats(list);
    renderCards(st);
    renderInsights(st, list);
    renderDaily(st, list);
    renderHeat(list);
    renderVolume(list);
    renderTable(list);
  }

  document.getElementById('meta').textContent =
    '数据源 ' + META.file + '　·　' + META.generated + ' 生成　·　' +
    '相邻样本间隔 ≤ ' + META.gap + ' 秒视为同一次佩戴　·　共 ' + SESSIONS.length + ' 次佩戴记录';

  document.getElementById('rangebar').addEventListener('click', function (e) {
    const btn = e.target.closest('button');
    if (!btn) return;
    range = btn.dataset.range;
    Array.from(this.children).forEach(b => b.classList.toggle('on', b === btn));
    render();
  });

  document.getElementById('footer').textContent =
    '由 podsstat 生成。时间按本机时区显示；本文件只含聚合结果与每次佩戴的起止时间，不含原始健康记录。';

  render();
})();
</script>
