name: PodsStatsLite
options:
  bundleIdPrefix: com.podsstats
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    SWIFT_STRICT_CONCURRENCY: minimal

targets:
  PodsStatsLite:
    type: application
    platform: iOS
    sources:
      - path: PodsStatsLite
      - path: ../Sources/PodsStatsCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.podsstats.lite
        PRODUCT_NAME: PodsStatsLite
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: PodsStatsLite/Info.plist
        CODE_SIGN_ENTITLEMENTS: PodsStatsLite/PodsStatsLite.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
